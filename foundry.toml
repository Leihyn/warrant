[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "london"   # CC3 (Frontier/Substrate EVM) omits mixHash; post-merge revm needs prevrandao
fs_permissions = [{ access = "read", path = "./test" }, { access = "read-write", path = "./deployments" }]
